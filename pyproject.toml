[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anvaya"
version = "0.1.0"
description = "Damage-aware ancient metagenome assembly research prototype"
requires-python = ">=3.13"

[project.scripts]
anvaya = "anvaya.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
